<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — AI Interview Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6c63ff;
            --primary-dark: #5a52e0;
            --accent: #ff6b6b;
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --border: rgba(108, 99, 255, 0.25);
            --text: #e2e2f0;
            --muted: #8888a8;
            --success: #4cbb7f;
            --error: #ff6b6b;
            --radius: 14px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background */
        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #ff6bff;
            bottom: -80px;
            right: -80px;
            animation-delay: -3s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: #6bffff;
            top: 50%;
            left: 60%;
            animation-delay: -6s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(20px, -20px) scale(1.05);
            }

            66% {
                transform: translate(-15px, 15px) scale(0.97);
            }
        }

        /* Card */
        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 16px;
        }

        .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #a970ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 12px;
            box-shadow: 0 8px 24px rgba(108, 99, 255, 0.4);
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .brand p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.25s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(108, 99, 255, 0.4);
        }

        /* Forms */
        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i.icon-left {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 15px;
        }

        .input-wrap .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            cursor: pointer;
            font-size: 15px;
            border: none;
            background: transparent;
            padding: 0;
            transition: color 0.2s;
        }

        .input-wrap .toggle-pw:hover {
            color: var(--primary);
        }

        input {
            width: 100%;
            padding: 12px 44px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.18);
        }

        input.error {
            border-color: var(--error);
        }

        .field-error {
            font-size: 12px;
            color: var(--error);
            margin-top: 5px;
            display: none;
        }

        .field-error.visible {
            display: block;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary), #a970ff);
            border: none;
            border-radius: var(--radius);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s, transform 0.15s;
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.35);
            margin-top: 8px;
        }

        .btn-submit:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Alert banner */
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .alert.visible {
            display: flex;
        }

        .alert.error {
            background: rgba(255, 107, 107, 0.12);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: var(--error);
        }

        .alert.success {
            background: rgba(76, 187, 127, 0.12);
            border: 1px solid rgba(76, 187, 127, 0.3);
            color: var(--success);
        }

        .divider {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin: 18px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--border);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .back-link {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--muted);
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">

            <div class="brand">
                <div class="brand-icon"><i class="fas fa-robot"></i></div>
                <h1>AI Interview Prep</h1>
                <p>Your personal AI interview coach</p>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Create Account</button>
            </div>

            <!-- Global error/success alert -->
            <div class="alert error" id="alert-error">
                <i class="fas fa-circle-exclamation"></i>
                <span id="alert-error-msg"></span>
            </div>
            <div class="alert success" id="alert-success">
                <i class="fas fa-circle-check"></i>
                <span id="alert-success-msg"></span>
            </div>

            <!-- ── LOGIN FORM ── -->
            <div class="form-panel active" id="panel-login">
                <form id="form-login" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope icon-left"></i>
                            <input type="email" id="login-email" placeholder="you@example.com" required
                                autocomplete="email">
                        </div>
                        <div class="field-error" id="err-login-email"></div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock icon-left"></i>
                            <input type="password" id="login-password" placeholder="Your password" required
                                autocomplete="current-password">
                            <button type="button" class="toggle-pw" onclick="togglePw('login-password', this)"><i
                                    class="fas fa-eye"></i></button>
                        </div>
                        <div class="field-error" id="err-login-password"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="btn-login">
                        <span class="spinner" id="spinner-login"></span>
                        <span id="btn-login-text"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</span>
                    </button>
                </form>
            </div>

            <!-- ── REGISTER FORM ── -->
            <div class="form-panel" id="panel-register">
                <form id="form-register" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-wrap">
                            <i class="fas fa-user icon-left"></i>
                            <input type="text" id="reg-name" placeholder="Your full name" required autocomplete="name">
                        </div>
                        <div class="field-error" id="err-reg-name"></div>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope icon-left"></i>
                            <input type="email" id="reg-email" placeholder="you@example.com" required
                                autocomplete="email">
                        </div>
                        <div class="field-error" id="err-reg-email"></div>
                    </div>
                    <div class="form-group">
                        <label>Password <span style="color:var(--muted);font-size:11px">(min 8 chars, 1 uppercase, 1
                                number, 1 symbol)</span></label>
                        <div class="input-wrap">
                            <i class="fas fa-lock icon-left"></i>
                            <input type="password" id="reg-password" placeholder="Create a strong password" required
                                autocomplete="new-password">
                            <button type="button" class="toggle-pw" onclick="togglePw('reg-password', this)"><i
                                    class="fas fa-eye"></i></button>
                        </div>
                        <div class="field-error" id="err-reg-password"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="btn-register">
                        <span class="spinner" id="spinner-register"></span>
                        <span id="btn-register-text"><i class="fas fa-user-plus"></i> Create Account</span>
                    </button>
                </form>
            </div>

            <div class="back-link">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        // Redirect if already logged in
        redirectIfLoggedIn();

        // Switch between login/register tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`panel-${tab}`).classList.add('active');
            hideAlerts();
        }

        function showError(msg) {
            document.getElementById('alert-error-msg').textContent = msg;
            document.getElementById('alert-error').classList.add('visible');
            document.getElementById('alert-success').classList.remove('visible');
        }
        function showSuccess(msg) {
            document.getElementById('alert-success-msg').textContent = msg;
            document.getElementById('alert-success').classList.add('visible');
            document.getElementById('alert-error').classList.remove('visible');
        }
        function hideAlerts() {
            document.getElementById('alert-error').classList.remove('visible');
            document.getElementById('alert-success').classList.remove('visible');
        }

        function setLoading(id, loading) {
            const btn = document.getElementById(`btn-${id}`);
            const spinner = document.getElementById(`spinner-${id}`);
            const text = document.getElementById(`btn-${id}-text`);
            btn.disabled = loading;
            spinner.style.display = loading ? 'block' : 'none';
            text.style.opacity = loading ? '0.5' : '1';
        }

        function togglePw(inputId, btn) {
            const input = document.getElementById(inputId);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.innerHTML = `<i class="fas fa-eye${isHidden ? '-slash' : ''}"></i>`;
        }

        // ── Login ──────────────────────────────────────────────────────────────────
        async function handleLogin(e) {
            e.preventDefault();
            hideAlerts();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            setLoading('login', true);
            try {
                await apiLogin(email, password);
                showSuccess('Welcome back! Redirecting…');
                setTimeout(() => window.location.href = 'interview.html', 800);
            } catch (err) {
                showError(err.message || 'Login failed. Please check your credentials.');
            } finally {
                setLoading('login', false);
            }
        }

        // ── Register ───────────────────────────────────────────────────────────────
        async function handleRegister(e) {
            e.preventDefault();
            hideAlerts();
            const full_name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            setLoading('register', true);
            try {
                const result = await apiRegister(full_name, email, password);
                // Show verification banner
                showSuccess(
                    result.email_verification_sent !== false
                        ? `✅ Account created! A verification email was sent to ${email}. Redirecting…`
                        : `✅ Account created! (Dev mode: check the server terminal for your verification link.) Redirecting…`
                );
                setTimeout(() => window.location.href = 'interview.html', 2500);
            } catch (err) {
                // Show field-level errors if available
                if (err.details) {
                    err.details.forEach(d => {
                        const el = document.getElementById(`err-reg-${d.field}`);
                        if (el) { el.textContent = d.message; el.classList.add('visible'); }
                    });
                }
                showError(err.message || 'Registration failed. Please try again.');
            } finally {
                setLoading('register', false);
            }
        }

        // Pre-fill tab from URL param: auth.html?tab=register
        const urlTab = new URLSearchParams(location.search).get('tab');
        if (urlTab === 'register') switchTab('register');
    </script>
</body>

</html>
